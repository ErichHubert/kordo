name: kordo-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kordo
      POSTGRES_PASSWORD: kordo
      POSTGRES_USER: kordo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kordo -d kordo"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
